name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run validate
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
        env:
          PAGES_BASE_PATH: /StoryKit/
      - run: npx playwright install --with-deps chromium
      - run: node demo/scripts/check-production.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
